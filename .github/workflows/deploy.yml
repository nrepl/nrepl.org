name: Deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # The latest version, the star count and the news come from GitHub and Meta
  # Redux at build time, so rebuild weekly to keep them current.
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

# Pull requests get a group of their own, so a PR build can't push a pending
# deploy out of the queue.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

env:
  # Bump deliberately: Hugo deprecates and removes things fairly often.
  HUGO_VERSION: 0.168.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Hugo
        run: |
          curl -fsSLo hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
      - name: Install the playground editor's packages
        # Nothing in them needs an install script, so none gets to run.
        run: npm ci --ignore-scripts
      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Build
        # --panicOnWarning turns deprecations into failures, so we hear
        # about them before the next Hugo bump removes something. The base
        # URL comes from the Pages settings, so the site also works before
        # the custom domain is attached.
        run: |
          hugo --minify --gc --panicOnWarning \
            ${{ steps.pages.outputs.base_url && format('--baseURL {0}/', steps.pages.outputs.base_url) || '' }}
        env:
          HUGO_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check the redirects to docs.nrepl.org
        # Every page the docs had here must still answer, or old links break.
        run: |
          expected=$(grep -c '^  - /nrepl/.*\.html$' data/legacy_docs.yaml)
          actual=$(find public/nrepl -name '*.html' | wc -l)
          echo "redirect pages: $actual of $expected"
          test "$actual" -eq "$expected"
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
