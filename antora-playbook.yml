site:
  title: nREPL
  url: https://nrepl.org/
  start_page: nrepl::index.adoc
  keys:
    google_analytics: 'G-H1N0TJ83PW'
content:
  sources:
  - url: https://github.com/nrepl/nrepl.git
    branches: ['master']
    tags: ['1.0.0-antora', '1.1.0', 'v1.2.0-antora', 'v1.3.1-antora', 'v1.4.0', 'v1.6.0', 'v1.7.0']
    start_path: doc
asciidoc:
  attributes:
    experimental: ''
    idprefix: ''
    idseparator: '-'
    toc: ~
    page-pagination: ''
ui:
  bundle:
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/master/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true
  supplemental_files: ./supplemental-ui
runtime:
  log:
    # Broken xrefs and unresolved includes are warnings; fail the build on them
    # rather than publishing dead links.
    failure_level: warn
output:
  dir: build/site
