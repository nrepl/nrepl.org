# The "Try it" section: an nREPL server running in the page (nrepl-sci, in
# Web Workers), with its messages in the section's wire window.
blurb: >-
  This is a real nREPL server, running right here in your browser:
  [nrepl-sci](https://github.com/nrepl/nrepl-sci), which evaluates
  ClojureScript with [SCI](https://github.com/babashka/sci). Evaluate some
  code and watch the messages go back and forth. Tab completes, and
  Shift+Enter starts a new line.
# Examples marked input need the page to be cross-origin isolated, which is
# what lets code wait for input.
examples:
  - code: (+ 1 2)
  - code: (println "Hello from nREPL!")
  - code: (defn greet [name] (str "Hello, " name "!"))
  - code: (greet "you")
  - code: (doc if)
  - code: (str "Hi, " (read-line))
    input: true
  - code: (range)
  - code: (throw (ex-info "Boom!" {:why "testing"}))
caption: >-
  Everything that went back and forth between this page and the server,
  live.
