{{- /* The history log. */ -}}
<figure class="wire-figure">
  <div class="wire-bar">
    <span class="wire-title">milestones</span>
  </div>
  <ol class="log">
    {{- range hugo.Data.milestones }}
    <li><time>{{ .date }}</time> <span>{{ partial "curly.html" .what }}</span></li>
    {{- end }}
  </ol>
</figure>
